<div class="shell">
  <header class="topbar">
    <a class="brand" routerLink="/home">Article Hole</a>

    <nav class="nav" aria-label="Primary">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/articles" routerLinkActive="active">Blog</a>
      <a routerLink="/about" routerLinkActive="active">About</a>
      @if (isAuthenticated()) {
        <a routerLink="/editor" routerLinkActive="active">New Post</a>
      }
    </nav>

    <div class="topbar-actions">
      @if (!isAuthenticated()) {
        <a routerLink="/login" routerLinkActive="active" class="ghost-button">Login</a>
        <a routerLink="/register" routerLinkActive="active" class="primary-button topbar-btn">Register</a>
      }

      <button type="button" class="theme-toggle" (click)="toggleTheme()" [title]="isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
        @if (isDarkMode()) {
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        } @else {
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        }
      </button>

      @if (currentUser()) {
        <div class="account-chip" aria-label="Signed in user">
          <div class="account-info">
            <span class="dot"></span>
            <span>{{ currentUser()?.name }}</span>
          </div>
          <button type="button" class="logout-button" (click)="logout()" title="Logout">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          </button>
        </div>
      }
    </div>
  </header>

  <main class="page-frame">
    <router-outlet></router-outlet>
  </main>

  <app-footer></app-footer>
</div>
